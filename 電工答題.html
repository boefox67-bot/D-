<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feiyue Education Centre · 電工答題 · 飛躍教育中心</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --ink:#122644; --blue:#2563eb; --orange:#e8720c; --green:#16a34a;
    --red:#dc2626; --bg:#f2f4f8; --card:#ffffff; --muted:#64748b; --line:#e2e8f0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding:0 0 40px}
  .view{display:none;padding:16px}
  .view.active{display:block}
  .topbar{background:var(--ink);color:#fff;padding:16px;border-radius:0 0 14px 14px;margin:-16px -16px 18px}
  .topbar h1{font-size:20px;font-weight:700}
  .topbar p{font-size:12px;opacity:.8;margin-top:4px}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(18,38,68,.06)}
  .card h2{font-size:16px;margin-bottom:10px;color:var(--ink)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--blue)}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;background:var(--blue);color:#fff}
  .btn.secondary{background:#e8eefc;color:var(--blue)}
  .btn.danger{background:#fde8e8;color:var(--red)}
  .btn.orange{background:var(--orange);color:#fff}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:10px}
  .row .btn{margin-top:0}
  .muted{color:var(--muted);font-size:12px}
  .warn{color:var(--orange);font-size:13px;font-weight:600;margin-top:8px}
  /* 答題選項 */
  .opt{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;font-size:15px;background:#fff}
  .opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid #94a3b8;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .15s}
  .opt.multi .dot{border-radius:6px}
  .opt.selected{border-color:var(--green);background:#f0fdf4}
  .opt.selected .dot{background:var(--green);border-color:var(--green)}
  .opt .letter{font-weight:700;color:var(--blue);flex-shrink:0}
  .qmeta{display:inline-block;font-size:11px;background:#e8eefc;color:var(--blue);padding:2px 8px;border-radius:20px;margin-bottom:8px}
  .qtext{font-size:16px;line-height:1.6;margin-bottom:6px}
  .progress{font-size:13px;color:var(--muted);margin-bottom:8px}
  /* 成績 */
  .bigscore{font-size:44px;font-weight:800;color:var(--blue);text-align:center;margin:8px 0}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .stat{background:#f8fafc;border-radius:10px;padding:12px;text-align:center}
  .stat .n{font-size:20px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .wronglist{font-size:14px;line-height:1.8}
  /* 老師功能 */
  .link-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .link-grid a,.link-grid button{padding:16px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none;display:block}
  .link-grid a:active,.link-grid button:active{background:#e8eefc}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600;background:#f8fafc}
  .tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600}
  .tag.ok{background:#dcfce7;color:var(--green)}
  .tag.bad{background:#fde8e8;color:var(--red)}
  .tag.star{background:#fef3c7;color:#b45309}
  footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:20px}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(18,38,68,.92);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:99;display:none;max-width:90%;text-align:center}
</style>

        <button data-go="papers">考卷管理</button>

        <button data-go="import">導入 X 檔題庫</button>
        <button data-go="questions">題庫管理（改題）</button>

<script>
/* ================= 數據層（localStorage） ================= */
const DB = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); if(window.Cloud) Cloud.queue(k, v); },
  remove(k){ localStorage.removeItem(k); }
};
const K = {
  questions:'quiz_questions_v2', papers:'quiz_papers_v1', activePaper:'quiz_active_paper',
  exams:'quiz_exams_v1', curExam:'quiz_cur_exam', classes:'quiz_classes_v1',
  students:'quiz_students_v1', locks:'quiz_name_locks', attempts:'quiz_attempts_v1',
  lastAttempt:'quiz_last_attempt', isTeacher:'quiz_is_teacher', pwd:'quiz_teacher_pwd',
  curClass:'quiz_cur_class', userName:'quiz_user_name', ver:'quiz_paper_version'
};

/* ================= 雲端同步（Firebase Realtime Database REST，可選；唔設網址就退回純本機） ================= */
const CLOUD_KEY='quiz_cloud_url';
// 部署前把 Firebase 網址填到下面引號內，所有手機會自動共用同一個雲端，唔使逐部機設定
const DEFAULT_CLOUD_URL='https://project-3342944994395704108-default-rtdb.firebaseio.com';
const SERVER_KEYS=['questions','papers','exams','classes','students','attempts','locks','pwd','ver'];
// 云端裸名 -> 本机 localStorage 键（K 里带 quiz_ 前缀）
const SERVER_MAP={
  questions:K.questions, papers:K.papers, exams:K.exams, classes:K.classes,
  students:K.students, attempts:K.attempts, locks:K.locks, pwd:K.pwd, ver:K.ver
};
const Cloud={
  _timers:{},
  url(){ let u=(DEFAULT_CLOUD_URL||localStorage.getItem(CLOUD_KEY)||'').trim(); return u?u.replace(/\/+$/,''):''; },
  enabled(){ return !!this.url(); },
  async raw(path, method, body){
    const u=this.url(); if(!u) throw new Error('未設定雲端網址');
    const res=await fetch(u+'/db'+(path?'/'+path+'.json':'.json'),{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  },
  bareOf(storageKey){ return SERVER_KEYS.find(b=>SERVER_MAP[b]===storageKey)||null; },
  queue(key,val){
    const bare=this.bareOf(key);
    if(!this.enabled() || !bare) return;
    clearTimeout(this._timers[bare]);
    this._timers[bare]=setTimeout(()=>this.pushKey(bare,val), bare==='attempts'?800:150);
  },
  async pushKey(bare,val){
    try{
      if(bare==='attempts'){
        let cur=[]; try{ cur=(await this.raw('attempts','GET'))||[]; }catch(e){ cur=[]; }
        if(!Array.isArray(cur)) cur=[];
        const have=new Set(cur.map(a=>a&&a.ts));
        (val||[]).forEach(a=>{ if(a&&a.ts!=null&&!have.has(a.ts)) cur.push(a); });
        await this.raw('attempts','PUT',cur);
      } else {
        await this.raw(bare,'PUT',val);
      }
    }catch(e){ console.warn('雲端上傳失敗',bare,e); }
  },
  async pull(){
    if(!this.enabled()) return false;
    let data; try{ data=await this.raw('','GET'); }catch(e){ console.warn('雲端讀取失敗',e); return false; }
    if(!data||typeof data!=='object') return false;
    let changed=false;
    SERVER_KEYS.forEach(b=>{ if(data[b]!==undefined){ DB.set(SERVER_MAP[b],data[b]); changed=true; } });
    return changed;
  },
  async pushAll(){
    if(!this.enabled()) return;
    for(const b of SERVER_KEYS){ const v=DB.get(SERVER_MAP[b], undefined); if(v!==undefined) await this.raw(b,'PUT',v); }
  },
  // 用雲端整份資料覆蓋本機現有檔案：雲端有就寫入，雲端冇就清除本機，令兩邊完全一致
  async forceDownload(){
    if(!this.enabled()) return {ok:false, n:0};
    const data=await this.raw('','GET');
    if(!data||typeof data!=='object') return {ok:false, n:0};
    let n=0;
    SERVER_KEYS.forEach(b=>{
      const lk=SERVER_MAP[b];
      if(data[b]!==undefined){ DB.set(lk,data[b]); n++; }
      else { localStorage.removeItem(lk); }
    });
    return {ok:true, n};
  },
  // 非破壞性補種：雲端某節點為空、但本機有資料，就把本機補傳上去；雲端已有就唔掂（唔覆蓋）
  async seedMissing(){
    if(!this.enabled()) return;
    for(const b of SERVER_KEYS){
      let cloudVal;
      try{ cloudVal=await this.raw(b,'GET'); }catch(e){ continue; }
      if(cloudVal!==undefined && cloudVal!==null) continue;
      const local=DB.get(SERVER_MAP[b], undefined);
      const empty = local===undefined || local===null || (Array.isArray(local)&&local.length===0) || (typeof local==='string'&&!local.trim());
      if(!empty){ try{ await this.raw(b,'PUT',local); }catch(e){ console.warn('補種失敗',b,e); } }
    }
  }
};
window.Cloud=Cloud;
// 同步後更新版本顯示（頁腳版本號 + 左下 v 標），唔使整頁重載
function updateVerDisplay(){
  const v=getVersion();
  const fv=document.getElementById('footer-ver'); if(fv) fv.textContent=v;
  const tag=document.getElementById('ver-tag'); if(tag) tag.textContent='v'+v;
}
// 雲端靜默同步後用：只更新下拉選項，保留學生已輸入嘅考試碼／班次／姓名，唔好清空
let currentRoster=[];
function refreshHomeOptions(){
  const codeBox=document.getElementById('in-code');
  const clsSel=document.getElementById('in-classSelect');
  const clsType=document.getElementById('in-classType');
  const nameSel=document.getElementById('in-nameSelect');
  const nameType=document.getElementById('in-nameType');
  const keepCode=codeBox?codeBox.value:'';
  const keepCls=clsSel?clsSel.value:'';
  const keepName=nameType?nameType.value:'';
  const classes=getClasses();
  if(clsSel){
    clsSel.innerHTML='<option value="">— 請揀班 —</option>'+classes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if(classes.includes(keepCls)) clsSel.value=keepCls;
  }
  reloadNameList(); // 按考試碼自動補班、重建名單（內部保留 codeBox 現值）
  if(codeBox) codeBox.value=keepCode;
  if(clsType) clsType.value=clsSel?clsSel.value:keepCls;
  // 名單重出後，嘗試還原原本揀嘅名
  if(nameSel && keepName){
    const idx=currentRoster.findIndex(s=>stuName(s)===keepName);
    nameSel.value=idx>=0?String(idx):'-1';
    nameType.value=keepName;
  }
  updateVerDisplay();
}
// 輕觸封面：同時由雲端讀取最新資料並刷新，然後淡出進入學生介面（學生介面唔做任何自動刷新）
async function splashEnter(){
  const s=document.getElementById('splash');
  if(!s || s.dataset.done) return;
  s.dataset.done='1';
  const tip=document.getElementById('splash-tip');
  if(tip) tip.textContent='讀取最新資料中…';
  try{ await Cloud.pull(); }catch(e){}
  refreshHomeOptions();
  updateVerDisplay();
  s.style.transition='opacity .35s ease';
  s.style.opacity='0';
  setTimeout(()=>{ if(s&&s.parentNode) s.parentNode.removeChild(s); },360);
}
function cloudRefreshView(){
  const active=document.querySelector('.view.active');
  const id=active?active.id:'';
  if(id==='view-home') refreshHomeOptions();
  else if(id==='view-teacher' && DB.get(K.isTeacher,false)===true) renderSub(curSub);
}
const EXAM_HOURS = 4, MAX_CLASSES = 6;
const TYPE_LABELS = ['單選題','多選題','計算題','混合題'];
function getVersion(){ return DB.get(K.ver, '4.9'); }
function renderOptContent(text){
  if(!text) return '（空）';
  let s=String(text);
  // Markdown 圖片 ![圖片](url)
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" style="max-width:120px;max-height:80px;vertical-align:middle;border-radius:4px">');
  // DISPIMG 公式 =DISPIMG("ID_xxx",1)
  const m=s.match(/^=DISPIMG\(["']([^"']+)["']/);
  if(m){
    const imgUrl=(window._xlsImages&&window._xlsImages[m[1]]);
    if(imgUrl){
      return `<img src="${imgUrl}" style="max-width:120px;max-height:80px;vertical-align:middle;border-radius:4px">`;
    }
    return `<span style="display:inline-block;padding:4px 8px;background:#fef3c7;border:1px dashed #f59e0b;border-radius:4px;font-size:12px;color:#92400e">[圖片 ${m[1].slice(0,20)}...]</span>`;
  }
  return s;
}
function bumpVersion(){
  const v=Math.round((getVersion()+0.1)*10)/10;

  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2200);
}

/* ================= 判分（同小程序一致） ================= */
function matchCalc(correct, user){
  const c=String(correct==null?'':correct).trim(), u=String(user==null?'':user).trim();
  if(!u) return false;
  if(c.toLowerCase()===u.toLowerCase()) return true;
  const nc=parseFloat(c), nu=extractNumber(u);
  if(!isNaN(nc) && nu!==null){ const tol=Math.abs(nc)>=1?0.051:0.0051; return Math.abs(nu-nc)<=tol; }
  return false;
}
function extractNumber(s){ const m=String(s).replace(/[,，\s]/g,'').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function partCorrect(pt, up){
  if(pt.kind==='fill'){
    const exp=Array.isArray(pt.answer)?pt.answer:[pt.answer];
    const got=Array.isArray(up)?up:[up];
    if(exp.length!==got.length) return false;
    return exp.every((e,i)=>matchCalc(e, got[i]));
  }
  const a=(pt.answer||[]).slice().sort(), b=(up||[]).slice().sort();
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}
function isCorrect(q, ua){
  if(q.type===4){
    if(!ua||!ua.parts) return false;
    const parts=q.parts||[], up=ua.parts||[];
    if(parts.length!==up.length) return false;
    return parts.every((pt,i)=>partCorrect(pt, up[i]));
  }
  if(q.type===3) return matchCalc(q.answer, ua);
  const a=(q.answer||[]).slice().sort(), b=(ua||[]).slice().sort();
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}
function questionScore(q, ua){
  const base=Number(q.score)||1;
  if(q.type===4){
    const parts=q.parts||[]; if(!parts.length) return 0;
    const per=base/parts.length, up=(ua&&ua.parts)||[];
    return parts.reduce((s,pt,i)=>partCorrect(pt,up[i])?s+per:s,0);
  }
  return isCorrect(q,ua)?base:0;
}

/* ================= 題目取得 ================= */
function getQuestions(){ return DB.get(K.questions, []); }
function getPapers(){ return DB.get(K.papers, []); }
function getExams(){ return DB.get(K.exams, []); }
function getActiveExams(){ const now=Date.now(); return getExams().filter(e=>e.expireAt>=now); }
function getClasses(){ const c=DB.get(K.classes, []); return Array.isArray(c)?c.map(String):[]; }
function getStudents(){ return DB.get(K.students, []); }
function getLocks(){ return DB.get(K.locks, {}); }
function getAttempts(){ return DB.get(K.attempts, []); }
function examByCode(code){ const c=String(code).trim(); return getActiveExams().find(e=>e.code===c)||null; }
function paperById(id){ return getPapers().find(p=>p.id===Number(id))||null; }
function questionsForExam(exam){
  if(exam && exam.paperIds && exam.paperIds.length){
    let n=0; exam.paperIds.forEach(pid=>{ const p=paperById(pid); if(p&&p.questions) n+=p.questions.length; }); return n;
  }
  if(exam && exam.paperId){ const p=paperById(exam.paperId); if(p&&p.questions&&p.questions.length) return p.questions.length; }
  return getQuestions().length;
}
// 組成答題列表：支援單卷／多卷混合、順序／隨機、抽指定題數；每題保留原始序號同原卷名
function buildQuizList(exam){
  let pool=[];
  const addPaper=(pid)=>{ const p=paperById(pid); if(!p||!p.questions) return; p.questions.forEach((q,idx)=>{ pool.push(Object.assign({},q,{_orig:idx+1,_paper:p.name,_pid:p.id})); }); };
  if(!exam.useAll && exam.paperIds&&exam.paperIds.length){ exam.paperIds.forEach(addPaper); }
  else if(!exam.useAll && exam.paperId){ addPaper(exam.paperId); }
  else { pool=getQuestions().map((q,idx)=>Object.assign({},q,{_orig:idx+1,_paper:'全部題庫'})); }
  let arr=pool.slice();
  if(exam.order==='rand'){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  }
  const n=Number(exam.drawCount)||0;
  if(n>0&&n<arr.length) arr=arr.slice(0,n);
  return arr;
}

/* ================= 首頁 ================= */
function stuName(s){ return typeof s==='string'?s:(s&&s.name?String(s.name):''); }
function stuCls(s){
  if(typeof s==='string') return [];
  if(!s||!s.cls) return [];
  if(Array.isArray(s.cls)) return s.cls.map(String);
  return [String(s.cls)];
}
function hasClass(s, c){ return stuCls(s).includes(c); }

function filteredStudents(){
  const exam=examByCode(document.getElementById('in-code').value.trim());
  const clsBox=document.getElementById('in-classSelect').value;
  const wantCls = exam ? exam.className : clsBox;
  return getStudents().filter(s=>{
    if(!wantCls) return stuCls(s).length===0; // 冇班就淨係未編班
    return hasClass(s, wantCls);
  });
}
function reloadNameList(){
  const code=document.getElementById('in-code').value.trim();
  const exam=examByCode(code);
  const clsSel=document.getElementById('in-classSelect');
  if(exam && clsSel.value!==exam.className){
    clsSel.value=exam.className;
    document.getElementById('in-classType').value=exam.className;
  }
  const clsWant = exam ? exam.className : clsSel.value;
  const sel=document.getElementById('in-nameSelect');
  if(!clsWant){
    currentRoster=[];
    sel.innerHTML='<option value="-1">— 請揀班 —</option>';
    return;
  }
  currentRoster=getStudents().filter(s=>hasClass(s, clsWant));
  sel.innerHTML='<option value="-1">— 請揀名 —</option>'+currentRoster.map((s,i)=>`<option value="${i}">${esc(stuName(s))}</option>`).join('');
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('btn-start').onclick = async function(){
  const warn=document.getElementById('home-warn'); warn.style.display='none';
  const code=document.getElementById('in-code').value.trim();
  const cls1=document.getElementById('in-classSelect').value;
  const cls2=document.getElementById('in-classType').value.trim();
  const si=Number(document.getElementById('in-nameSelect').value);
  const name=document.getElementById('in-nameType').value.trim();
  if(!code){ warnMsg('請輸入考試碼'); return; }
  // 入場前先由雲端拉最新考試碼同考卷，避免本機未同步就誤判無效
  try{ await Cloud.pull(); }catch(e){}
  const exam=examByCode(code);
  if(!exam){ warnMsg('考試碼唔啱或者已過期'); return; }
  // 只認有效考卷：連結嘅卷要存在且有題，否則拒絕入場
  if(!questionsForExam(exam).length){ warnMsg('呢場考試連結嘅考卷無效或者冇題目'); return; }
  if(!cls1){ warnMsg('請揀班'); return; }
  if(cls1!==exam.className){ warnMsg('呢個考試碼唔屬於「'+cls1+'」，請揀返「'+exam.className+'」'); return; }
  if(cls2!==cls1){ warnMsg('班次第二欄要同第一欄一致'); return; }
  // 按考試碼重建名單，保證下拉 index 同實際名單一致
  reloadNameList();
  const sts=currentRoster;
  if(si<0){ warnMsg('請先從名單揀名'); return; }
  const chosen=sts[si]?stuName(sts[si]):'';
  if(chosen!==name){ warnMsg('填寫姓名同名單唔一致，請重新揀'); return; }
  let lock=getLocks()[name];
  // 舊碼已被老師關閉或過期＝無效，自動解鎖，唔再擋學生
  if(lock && !examByCode(lock.code)){
    const L=getLocks(); delete L[name]; DB.set(K.locks,L); lock=null;
  }
  if(lock && lock.state==='submitted'){ warnMsg('呢個名已經交卷，唔可以再入考場'); return; }
  if(lock && lock.state==='active' && lock.code!==code){
    // 同一個學生由第一場直入第二場：先問登出舊場，再開新場；已交卷成績唔受影響
    if(!confirm('你正在第「'+lock.code+'」場，要登出並直接入新考場「'+code+'」嗎？\n未交卷嘅作答唔會保留，已經交卷嘅成績唔受影響。')) return;
    QZ=null; // 丟棄舊場未交卷草稿
  }
  // 只認有效考卷：無效／空卷唔准入
  if(!questionsForExam(exam).length){ warnMsg('呢場考卷無效或者冇題目，請聯絡老師'); return; }
  DB.set(K.curExam, exam);
  DB.set(K.userName, name);
  const locks=getLocks(); locks[name]={code,state:'active',at:Date.now()}; DB.set(K.locks, locks);
  startQuiz(exam, name);
};

/* ================= 答題頁 ================= */
let QZ = null; // { exam, name, list, answers, idx }
function startQuiz(exam, name){
  const list=buildQuizList(exam);
  if(!list.length){ toast('呢場考卷無效或者冇題目'); return; }
  QZ={ exam, name, list, answers:list.map(()=>null), idx:0 };
  let pname='全部題庫';
  if(exam.paperIds&&exam.paperIds.length>1) pname='混合卷（'+exam.paperIds.length+'張）';
  else if(exam.paperId){ const p=paperById(exam.paperId); pname=p?p.name:'考卷'; }
  document.getElementById('quiz-paperName').textContent=pname;
  document.getElementById('quiz-className').textContent = (exam.className||'')+' · '+name;
  go('quiz'); renderQuiz();
}
function renderQuiz(){
  if(!QZ){ go('home'); return; }
  // 檢查考試碼仲存在／未過期（後台可能已關閉考場）
  if(!examByCode(QZ.exam.code)){ alert('呢場考試已被老師關閉，刷新頁面返回首頁'); go('home'); return; }
  const {list, answers, idx}=QZ;
  const q=list[idx];
  document.getElementById('quiz-progress').textContent=`第 ${idx+1} / ${list.length} 題 · ${TYPE_LABELS[q.type-1]||''}`+(q.score?` · ${q.score}分`:'');
  let html='';
  html+=`<span class="qmeta">${TYPE_LABELS[q.type-1]||''}</span>`;
  html+=`<div class="qtext">${idx+1}. ${renderOptContent(q.question)}</div>`;
  if(q.type===4){
    (q.parts||[]).forEach((pt,pi)=>{
      html+=`<div style="margin:10px 0 4px;font-size:13px;color:var(--muted)">第${pi+1}部分（${pt.kind==='fill'?'填寫':pt.kind==='tf'?'是非':pt.kind==='multi'?'多選':'單選'}）</div>`;
      if(pt.kind==='fill'){
        const cur=(answers[idx]&&answers[idx].parts&&typeof answers[idx].parts[pi]==='string')?answers[idx].parts[pi]:'';
        html+=`<input data-part="${pi}" data-kind="fill" class="fill-input" inputmode="decimal" placeholder="輸入數字答案" value="${esc(cur)}">`;
      } else {
        const selArr=(answers[idx]&&answers[idx].parts&&Array.isArray(answers[idx].parts[pi]))?answers[idx].parts[pi]:[];
        pt.options.forEach((op,oi)=>{
          const on=selArr.includes(oi);
          html+=`<div class="opt ${pt.kind==='multi'?'multi':''} ${on?'selected':''}" data-part="${pi}" data-opt="${oi}">
            <span class="dot">${on?'✓':''}</span><span class="letter">${'ABCDEF'.charAt(oi)}</span><span>${renderOptContent(op)}</span></div>`;
        });
      }
    });
  } else if(q.type===3){
    const cur=answers[idx]==null?'':answers[idx];
    html+=`<input data-kind="fill" class="fill-input" inputmode="decimal" placeholder="輸入計算答案" value="${esc(cur)}">`;
  } else {
    const kind=q.type===2?'multi':'';
    const selArr=Array.isArray(answers[idx])?answers[idx]:[];
    q.options.forEach((op,oi)=>{
      const on=selArr.includes(oi);
      html+=`<div class="opt ${kind} ${on?'selected':''}" data-opt="${oi}">
        <span class="dot">${on?'✓':''}</span><span class="letter">${'ABCDEF'.charAt(oi)}</span><span>${renderOptContent(op)}</span></div>`;
    });
  }
  document.getElementById('quiz-card').innerHTML=html;
  // 事件
  document.querySelectorAll('#quiz-card .opt').forEach(el=>{
    el.onclick=()=>{
      const qq=QZ.list[QZ.idx];
      if(qq.type===4){
        const pi=Number(el.dataset.part), oi=Number(el.dataset.opt);
        const pt=qq.parts[pi];
        if(!QZ.answers[QZ.idx]||!QZ.answers[QZ.idx].parts) QZ.answers[QZ.idx]={parts:qq.parts.map(()=>[])};
        let arr=Array.isArray(QZ.answers[QZ.idx].parts[pi])?QZ.answers[QZ.idx].parts[pi].slice():[];
        if(pt.kind==='multi'){ arr=arr.includes(oi)?arr.filter(x=>x!==oi):[...arr,oi]; }
        else { arr=[oi]; }
        QZ.answers[QZ.idx].parts[pi]=arr;
      } else {
        const oi=Number(el.dataset.opt);
        if(qq.type===2){
          let arr=Array.isArray(QZ.answers[QZ.idx])?QZ.answers[QZ.idx].slice():[];
          arr=arr.includes(oi)?arr.filter(x=>x!==oi):[...arr,oi];
          QZ.answers[QZ.idx]=arr;
        } else { QZ.answers[QZ.idx]=[oi]; }
      }
      renderQuiz();
    };
  });
  document.querySelectorAll('#quiz-card .fill-input').forEach(el=>{
    el.oninput=()=>{
      const qq=QZ.list[QZ.idx];
      if(qq.type===4){
        const pi=Number(el.dataset.part);
        if(!QZ.answers[QZ.idx]||!QZ.answers[QZ.idx].parts) QZ.answers[QZ.idx]={parts:qq.parts.map((p,i)=>p.kind==='fill'?'':[])};
        QZ.answers[QZ.idx].parts[pi]=el.value;
      } else { QZ.answers[QZ.idx]=el.value; }
    };
  });
  document.getElementById('btn-next').textContent = idx===list.length-1 ? '完成作答' : '下一題';
  document.getElementById('btn-submit').style.display = (idx===list.length-1)?'block':'none';
}
document.getElementById('btn-prev').onclick=()=>{ if(QZ.idx>0){ QZ.idx--; renderQuiz(); } };
document.getElementById('btn-next').onclick=()=>{ if(QZ.idx<QZ.list.length-1){ QZ.idx++; renderQuiz(); } };

document.getElementById('btn-submit').onclick=()=>{
  const {list, answers}=QZ;
  const untouched=[];
  list.forEach((q,i)=>{
    const a=answers[i];
    let empty=false;
    if(q.type===4){
      empty=(q.parts||[]).every(pt=>{
        const ua=a&&a.parts?a.parts[q.parts.indexOf(pt)]:null;
        if(pt.kind==='fill') return ua==null||ua==='';
        return !ua || (Array.isArray(ua)&&ua.length===0);
      });
    } else if(q.type===3){
      empty=a==null||a==='';
    } else {
      empty=!a || (Array.isArray(a)&&a.length===0);
    }
    if(empty) untouched.push(i+1);
  });
  let msg='確認交卷？交卷後個名會鎖死，唔可以再入本卷';
  if(untouched.length) msg='⚠ 未作答題號：'+untouched.join('、')+'\n\n'+msg;
  if(!confirm(msg)) return;
  const {exam, name}=QZ;
  // 檢查考試碼仲存在（後台可能已關閉考場）
  if(!examByCode(exam.code)){ alert('呢場考試已被老師關閉，唔可以交卷'); go('home'); return; }
  let totalScore=0, gotScore=0, wrongIdx=[];
  list.forEach((q,i)=>{
    const sc=Number(q.score)||1; totalScore+=sc;
    const got=questionScore(q, answers[i]); gotScore+=got;
    if(!isCorrect(q, answers[i])) wrongIdx.push({i:i+1, orig:q._orig, paper:q._paper, q, ua:answers[i]});
  });
  let pn='全部題庫';
  if(exam.paperIds&&exam.paperIds.length>1) pn='混合卷（'+exam.paperIds.length+'張）';
  else if(exam.paperId){ const p=paperById(exam.paperId); pn=p?p.name:'考卷#'+exam.paperId; }
  const attempt={
    name, className:exam.className||'', paperName:pn,
    score:Math.round(gotScore*10)/10, total:list.length, totalScore,
    score100: totalScore?Math.min(100, Math.round(gotScore/totalScore*100)):0,
    date:new Date().toLocaleString('zh-HK'),
    ts:Date.now(),
    wrong:wrongIdx,
    detail:list.map((q,i)=>({question:q.question,type:q.type,parts:q.parts||null,options:q.options,answer:q.answer,score:Number(q.score)||0,orig:q._orig,paper:q._paper,ok:isCorrect(q,answers[i]),userAnswer:answers[i]}))
  };
  const att=getAttempts(); att.push(attempt); DB.set(K.attempts, att);
  DB.set(K.lastAttempt, attempt);
  const locks=getLocks(); locks[name]={code:exam.code,state:'submitted',at:Date.now()}; DB.set(K.locks, locks);
  DB.remove(K.curExam);
  showResult(attempt);
};
function showResult(a){
  go('result');
  document.getElementById('result-score').textContent=a.score+' / '+a.totalScore;
  document.getElementById('result-paper').textContent=a.paperName+' · '+a.name+' · '+a.className;
  document.getElementById('result-correct').textContent= a.total - (a.wrong?a.wrong.length:0) +' / '+a.total;
  document.getElementById('result-pct').textContent=a.score100+'%';
  if(!a.wrong || !a.wrong.length){
    document.getElementById('result-wrong').innerHTML='<span class="tag ok">全對！</span>';
  } else {
    document.getElementById('result-wrong').innerHTML=a.wrong.map(w=>{
      let extra='';
      if(w.q.type===4){
        extra=(w.q.parts||[]).map((pt,pi)=>{
          const up=(w.ua&&w.ua.parts)?w.ua.parts[pi]:null;
          return partCorrect(pt,up)?'':`；第${pi+1}部分（${pt.kind==='fill'?'填寫':pt.kind==='tf'?'是非':pt.kind==='multi'?'多選':'單選'}）錯`;
        }).join('');
      }
      const src=w.paper?`《${esc(w.paper)}》原第 ${w.orig||w.i} 題`:`全部題庫 原第 ${w.orig||w.i} 題`;
      return `<div style="margin:6px 0"><b>${src}</b>（本場第 ${w.i} 題）${esc(extra)}</div>`;
    }).join('');
  }
  // 逐題對答案
  const det=a.detail||[];
  const ansText=(d, ua)=>{
    if(d.type===4){
      const parts=d.parts||[];
      return parts.map((pt,pi)=>{
        const up=ua&&ua.parts?ua.parts[pi]:null;
        const upTxt=fmtPartAns(pt, up);
        const coTxt=fmtPartAns(pt, pt.answer);
        return `第${pi+1}部分：你答「${upTxt}」／正確「${coTxt}」`;
      }).join('；');
    }
    if(d.type===3){
      return `你答「${fmtUserAns(ua)}」／正確「${d.answer}」`;
    }
    const opts=d.options||[];
    const coArr=Array.isArray(d.answer)?d.answer:[d.answer];
    const coTxt=coArr.map(i=>opts[i]!==undefined?opts[i]:('選項'+(i+1))).join('、');
    const upArr=Array.isArray(ua)?ua:(ua==null||ua===''?[]:[ua]);
    const upTxt=upArr.map(i=>opts[i]!==undefined?opts[i]:('選項'+(i+1))).join('、')||'（未作答）';
    return `你答「${upTxt}」／正確「${coTxt}」`;
  };
  const fmtPartAns=(pt, up)=>{
    if(pt.kind==='fill') return String(up==null||up===''?'（未作答）':up);
    const opts=pt.options||[];
    const arr=Array.isArray(up)?up:(up==null?[]:[up]);
    return arr.map(i=>opts[i]!==undefined?opts[i]:('選項'+(i+1))).join('、')||'（未作答）';
  };
  const fmtUserAns=ua=>String(ua==null||ua===''?'（未作答）':ua);
  document.getElementById('result-detail').innerHTML=det.map((d,i)=>{
    const ok=isCorrect(d, d.userAnswer);
    const tag=ok?'<span class="tag ok">啱</span>':'<span class="tag bad">錯</span>';
    const sc=Number(d.score)||0;
    const src=d.paper?`《${esc(d.paper)}》原第 ${d.orig||(i+1)} 題`:`原第 ${d.orig||(i+1)} 題`;
    return `<div style="padding:8px;border-bottom:1px solid var(--line)">
      <div><b>第${i+1}題</b> ${tag} <span class="muted" style="font-size:12px">（${sc}分）· ${src}</span></div>
      <div style="color:var(--muted);margin:4px 0">${esc(d.question)}</div>
      <div style="font-size:13px">${esc(ansText(d, d.userAnswer))}</div>
    </div>`;
  }).join('');
}

    function renderTable(list){

    function refreshTable(){
      const from=document.getElementById('A-from').value;
      const to=document.getElementById('A-to').value;
      let list=sortedAll;
      // 手動 parse zh-HK 格式日期：「15/10/2026 下午 4:10:10」
      function parseZhDate(s){
        if(!s) return null;
        const m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s*(上午|下午)?\s*(\d{1,2}):(\d{1,2}):(\d{1,2})/);
        if(!m) return null;
        let [_,d,mo,y,ap,h,mi,se]=m;
        h=Number(h); if(ap==='下午'&&h<12) h+=12; if(ap==='上午'&&h===12) h=0;
        return new Date(Number(y),Number(mo)-1,Number(d),h,Number(mi),Number(se)).getTime();
      }
      const tsOf=a=>a.ts||parseZhDate(a.date);
      if(from){ const f=new Date(from).getTime(); list=list.filter(a=>{ const t=tsOf(a); return t!==null&&t>=f; }); }
      if(to){ const t=new Date(to).getTime(); list=list.filter(a=>{ const ts=tsOf(a); return ts!==null&&ts<=t; }); }

          toast('已拆除');
          sortedAll.splice(sortedAll.indexOf(a),1);
          refreshTable();
        };
      });
    }

      const rows3=(getQuestions()).map((q,i)=>({序號:i+1,題型:TYPE_LABELS[q.type-1]||'',題目:q.question,分數:Number(q.score)||1,答案:JSON.stringify(q.answer||q.parts||'')}));
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows1),'成績記錄');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows2),'作答明細');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows3),'題庫');
      const d=new Date();
      XLSX.writeFile(wb,'電工答題成績_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.xlsx');
      toast('已導出 '+curList.length+' 筆成績');
    };

function renderActiveExams(){
  const el=document.getElementById('L-list'); if(!el) return;
  const ex=getActiveExams();
  const locks=getLocks();
  function statusOf(name, code){
    const lk=locks[name];
    if(lk && lk.code===code){
      if(lk.state==='submitted') return 'done';
      if(lk.state==='active') return 'active';
    }
    return 'todo';
  }
  el.innerHTML = ex.length? ex.map(e=>{
    // 名單：本班學生＋本場有鎖嘅人（防止漏網）
    const seen=new Map();
    getStudents().filter(s=>hasClass(s,e.className)).forEach(s=>seen.set(stuName(s),1));
    for(const n in locks){ if(locks[n].code===e.code) seen.set(n,1); }
    const names=[...seen.keys()].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-Hans-CN'));
    let done=0, active=0, todo=0;
    const chips=names.map(n=>{
      const st=statusOf(n,e.code);
      if(st==='done') done++;
      else if(st==='active') active++;
      else todo++;
      const col=st==='done'?'#16a34a':st==='active'?'#eab308':'#9ca3af';
      const txt=st==='done'?'已完成':st==='active'?'作答中':'未開始';
      return `<span style="display:inline-block;margin:2px;padding:2px 8px;border-radius:12px;background:${col};color:#fff;font-size:12px">${esc(n)} · ${txt}</span>`;
    }).join('');
    const pname=e.useAll||(!e.paperIds?.length&&!e.paperId)?'全部題庫':(e.paperIds&&e.paperIds.length>1?'混合卷('+e.paperIds.length+'張)':(paperById(e.paperId)?.name||'考卷'));
    return `<div style="padding:8px;border-bottom:1px solid var(--line)">
      <b>碼 ${e.code}</b> · ${esc(e.className)} · ${esc(pname)} · 剩餘 ${Math.max(0,Math.round((e.expireAt-Date.now())/3600000*10)/10)}小時
      <div style="margin:6px 0;font-size:13px">
        <span style="color:#16a34a">已完成 ${done}</span> ·
        <span style="color:#ca8a04">作答中 ${active}</span> ·
        <span class="muted">未開始 ${todo}</span> · 共 ${names.length} 人
      </div>
      <div style="margin:6px 0;line-height:2">${chips||'<span class="muted">名單為空</span>'}</div>
      <button class="btn danger" style="margin-top:6px;padding:8px" onclick="endExam('${e.code}')">結束呢場考試</button></div>`;
  }).join('') : '<span class="muted">冇進行中考試</span>';
}

function exportPaperXlsx(){
  const sel=document.getElementById('Q-paperSel');
  const pid=sel?Number(sel.value):null;
  const papers=getPapers();
  const p=papers.find(x=>x.id===pid)||papers[0];
  if(!p){ toast('沒有考卷可導出'); return; }
  // 將 base64 圖片壓縮並保留，避免超過 Excel 儲存格 32767 字元限制
  const cleanText=(s)=>{
    if(!s) return '';
    s=String(s);
    // 如果超過 32000 字元，嘗試將 base64 圖片替換做 [圖片]
    if(s.length>32000){
      s=s.replace(/!\[([^\]]*)\]\([^)]+\)/g, '[圖片]');
    }
    return s;
  };
  const headers=['序號','問題','填寫題','單選題','多選題','是非題','填寫題答案位內容',
    '單選題答案位A內容','單選題答案位B內容','單選題答案位C內容','單選題答案位D內容','單選題答案位E內容','單選題答案位F內容',
    '多選題答案位A內容','多選題答案位B內容','多選題答案位C內容','多選題答案位D內容','多選題答案位E內容','多選題答案位F內容',
    '填寫題答案位(學生)','單選題A(學生)','單選題B(學生)','單選題C(學生)','單選題D(學生)','單選題E(學生)','單選題F(學生)',
    '多選題A(學生)','多選題B(學生)','多選題C(學生)','多選題D(學生)','多選題E(學生)','多選題F(學生)',
    '是非題對(學生)','是非題錯(學生)','多少分題'];
  const rows=[headers];
  (p.questions||[]).forEach((q,idx)=>{
    const row=new Array(35).fill('');
    row[0]=idx+1;
    row[1]=cleanText(q.question);
    row[34]=q.score||'';
    if(q.type===3){
      row[2]=1; // 填寫題
      row[6]=cleanText(q.answer); // 填寫答案
    } else if(q.type===1){
      row[3]=1; // 單選題
      const ans=q.answer||[];
      (q.options||[]).forEach((op,i)=>{ row[7+i] = cleanText(op); });
      for(let i=0;i<6;i++){ row[20+i] = ans.includes(i)?1:0; }
    } else if(q.type===2){
      row[4]=1; // 多選題
      const ans=q.answer||[];
      (q.options||[]).forEach((op,i)=>{ row[13+i] = cleanText(op); });
      for(let i=0;i<6;i++){ row[26+i] = ans.includes(i)?1:0; }
    } else if(q.type===4){
      // 混合題
      (q.parts||[]).forEach(pt=>{
        if(pt.kind==='fill'){
          row[2]=1; row[6]=cleanText(pt.answer);
        } else if(pt.kind==='single'){
          row[3]=1;
          const ans=pt.answer||[];
          (pt.options||[]).forEach((op,i)=>{ row[7+i] = cleanText(op); });
          for(let i=0;i<6;i++){ row[20+i] = ans.includes(i)?1:0; }
        } else if(pt.kind==='multi'){
          row[4]=1;
          const ans=pt.answer||[];
          (pt.options||[]).forEach((op,i)=>{ row[13+i] = cleanText(op); });
          for(let i=0;i<6;i++){ row[26+i] = ans.includes(i)?1:0; }
        } else if(pt.kind==='tf'){
          row[5]=1;
          const ans=pt.answer||[];
          row[32] = ans.includes(0)?1:0;
          row[33] = ans.includes(1)?1:0;
        }
      });
    }
    rows.push(row);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'題庫');
  XLSX.writeFile(wb, (p.name||'題庫')+'.xlsx');
  toast('已導出X檔');
}

function hasKW(h, kws){ return kws.some(k=>String(h).indexOf(k)>=0); }
function detectColumns(rows){
  const first=rows[0]||[], joined=first.join('|');
  if(hasKW(joined,['问题','問題']) && (hasKW(joined,['填写题','填寫題'])||hasKW(joined,['单选题','單選題'])||hasKW(joined,['是非题','是非題']))){
    // 固定映射（跟標準考卷範本）
    // B=問題, C=填寫題, D=單選題, E=多選題, F=是非題, G=填寫題答案
    // H-M(8-13)=單選選項A-F, N-S(14-19)=多選選項A-F
    // T(20)=填寫題學生答案, U-Z(21-26)=單選學生答案A-F, AA-AF(27-32)=多選學生答案A-F
    // AG(33)=是非對, AH(34)=是非錯, AI(35)=多少分題
    const singleOpt=[8,9,10,11,12,13];
    const multiOpt=[14,15,16,17,18,19];
    const singleStudent=[21,22,23,24,25,26];
    const multiStudent=[27,28,29,30,31,32];
    return {header:true, fmt:2, col:{question:2,fillMark:3,singleMark:4,multiMark:5,tfMark:6,fillAns:7,singleOpt,multiOpt,singleStudent,multiStudent,tfTrue:33,tfFalse:34,score:35}};
  }
  return {header:false, fmt:0, col:{}};
}
function rowToQuestion(cells, col){
  const get=idx=>{ if(!idx) return ''; const v=cells[idx-1]; return v==null?'':String(v).trim(); };
  const isMark=idx=>{ if(!idx) return false; return String(cells[idx-1]??'').trim()==='1'; };
  const question=get(col.question); if(!question) return null;
  // debug
  console.log('rowToQuestion:', {question, col, cellsLen: cells.length, h: get(8), i: get(9), j: get(10), k: get(11)});
  const hasAny=idxs=>idxs.some(i=>get(i));
  const singleHas=hasAny(col.singleOpt), multiHas=hasAny(col.multiOpt);
  const tfHas=isMark(col.tfTrue)||isMark(col.tfFalse);
  let type;
  if(isMark(col.fillMark)) type=3; else if(multiHas) type=2; else if(singleHas||tfHas) type=1; else return null;
  const q={type, question, options:[], answer:[], score:0};
  const scN=parseFloat(get(col.score)); q.score=(!scN||scN<=0)?0:scN;
  const marks=[];
  if(isMark(col.singleMark)) marks.push('single');
  if(isMark(col.multiMark)) marks.push('multi');
  if(isMark(col.tfMark)) marks.push('tf');
  if(isMark(col.fillMark)) marks.push('fill');
  if(marks.length>=2){
    const parts=[];
    marks.forEach(kind=>{
      if(kind==='single'){ const so=col.singleOpt.map(get).filter(Boolean); const sa=[]; col.singleStudent.forEach((s,i)=>{ if(isMark(s)&&i<so.length) sa.push(i); }); if(so.length) parts.push({kind:'single',options:so,answer:sa}); }
      else if(kind==='multi'){ const mo=col.multiOpt.map(get).filter(Boolean); const ma=[]; col.multiStudent.forEach((s,i)=>{ if(isMark(s)&&i<mo.length) ma.push(i); }); if(mo.length) parts.push({kind:'multi',options:mo,answer:ma}); }
      else if(kind==='tf'){ const ta=[]; if(isMark(col.tfTrue)) ta.push(0); if(isMark(col.tfFalse)) ta.push(1); parts.push({kind:'tf',options:['正確','錯誤'],answer:ta}); }
      else { const raw=get(col.fillAns); const vals=String(raw).split(/[;,，；\s]+/).filter(t=>t.trim());
        if(vals.length>1) parts.push({kind:'fill',answer:vals.map(t=>{const n=parseFloat(t); return isNaN(n)?t:n;})});
        else if(vals.length===1){ const n=parseFloat(vals[0]); parts.push({kind:'fill',answer:isNaN(n)?vals[0]:n}); }
        else parts.push({kind:'fill',answer:''});
      }
    });
    q.type=4; q.parts=parts; q.options=[]; q.answer=[];
  } else if(type===3){ const n=parseFloat(get(col.fillAns)); q.answer=isNaN(n)?get(col.fillAns):n; }
  else if(type===2){ col.multiOpt.forEach(o=>{ const v=get(o); if(v) q.options.push(v); }); while(q.options.length<4) q.options.push('選項'+String.fromCharCode(65+q.options.length)); const idxs=[]; col.multiStudent.forEach((s,i)=>{ if(isMark(s)&&i<q.options.length) idxs.push(i); }); q.answer=idxs; }
  else if(tfHas){ q.options=['正確','錯誤']; q.answer=isMark(col.tfTrue)?[0]:[1]; }
  else { col.singleOpt.forEach(o=>{ const v=get(o); if(v) q.options.push(v); }); while(q.options.length<4) q.options.push('選項'+String.fromCharCode(65+q.options.length)); let idx=-1; col.singleStudent.forEach((s,i)=>{ if(isMark(s)&&i<q.options.length) idx=i; }); q.answer=idx>=0?[idx]:[]; }
  return q;
}
function rowsToQuestions(rows, col){
  if(!col) return [];
  const out=[]; const start=1;
  for(let i=start;i<rows.length;i++){ const q=rowToQuestion(rows[i], col); if(q) out.push(q); }
  // 分數規則：AI 欄寫 0 或空 = 用百分比計分（剩餘分數平均分俾呢啲題目）；寫 1/5/10 等 = 直接占用嗰個百分比
  const scored=out.filter(q=>q.score>0);
  const unscored=out.filter(q=>!q.score||q.score<=0);
  let scoredTotal=scored.reduce((s,q)=>s+q.score,0);
  // 如果寫咗嘅分數總和超過 100，按比例縮水
  if(scoredTotal>100){ const scale=100/scoredTotal; scored.forEach(q=>q.score=Math.round(q.score*scale*100)/100); scoredTotal=100; }
  if(unscored.length){
    const remain=Math.max(0,100-scoredTotal);
    const per=unscored.length?Math.round(remain/unscored.length*100)/100:0;
    unscored.forEach(q=>q.score=per);
  }
  return out;
}
