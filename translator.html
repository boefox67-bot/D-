<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>離線粵英翻譯</title>
<style>
  :root{
    --ink:#0f2a44; --ink2:#163a5c; --amber:#f59e0b; --orange:#ea580c;
    --bg:#f4f7fb; --card:#ffffff; --line:#dbe4ee; --muted:#64748b; --ok:#0f766e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"PingFang HK","PingFang SC","Microsoft JhengHei","Microsoft YaHei",system-ui,sans-serif;
       line-height:1.55}
  header{background:linear-gradient(160deg,#0f2a44,#163a5c 60%,#1d4a72);color:#fff;padding:22px 18px 26px;
         border-bottom-left-radius:22px;border-bottom-right-radius:22px}
  header h1{margin:0;font-size:22px;letter-spacing:.5px}
  header p{margin:6px 0 0;font-size:13px;opacity:.78}
  .wrap{padding:16px 14px 40px;max-width:760px;margin:0 auto}
  .dir{display:flex;gap:8px;margin-bottom:10px}
  .dir button{flex:1;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
              color:var(--ink);font-size:14.5px;font-weight:800;cursor:pointer;line-height:1.25}
  .dir button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1a1207}
  .dir button small{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:2px}
  .panel{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(15,42,68,.07);margin-bottom:14px}
  label.mini{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  textarea{width:100%;min-height:92px;padding:12px;border:1.5px solid var(--line);border-radius:12px;
           font-size:17px;line-height:1.5;resize:vertical;font-family:inherit;color:var(--ink);background:#fbfdff}
  textarea:focus{outline:none;border-color:var(--amber);background:#fff}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{border:none;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:800;cursor:pointer;
       background:var(--orange);color:#fff;flex:1;min-width:110px}
  .btn.ghost{background:#eef3f9;color:var(--ink);font-weight:700}
  .btn.ghost:active{background:#e2e9f2}
  .out{background:#fbfdff;border:1.5px dashed var(--line);border-radius:14px;padding:13px;
       font-size:26px;min-height:70px;word-break:break-word;color:#0b2540;font-weight:700;line-height:1.35}
  .out.mid{font-size:19px;color:#3c556e;min-height:56px;background:#f7fafc;font-weight:400}
  .out.empty{color:#9aa9b8;font-size:16px;font-weight:400}
  .tag{display:inline-block;font-size:12px;color:var(--ok);background:#e6f4f1;border-radius:8px;padding:2px 8px;margin-bottom:8px}
  .auto{margin-top:10px;width:100%;border:1.5px solid var(--orange);background:#fff;color:var(--orange);
        border-radius:12px;padding:12px;font-size:15px;font-weight:800;cursor:pointer}
  .auto[aria-pressed="true"]{background:var(--orange);color:#fff}
  .devline{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13.5px;
        color:var(--ink);cursor:pointer}
  .chip:active{background:#fff7e6;border-color:var(--amber)}
  h2.sec{font-size:13px;color:var(--muted);font-weight:700;margin:18px 2px 8px;letter-spacing:.4px}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
  .status{font-size:12.5px;color:var(--orange);font-weight:700;margin-top:8px;min-height:18px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(15,42,68,.94);color:#fff;
         padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:9}
  .toast.show{opacity:1}
  .focus{position:fixed;inset:0;background:linear-gradient(160deg,#0f2a44,#163a5c 55%,#1d4a72);color:#fff;
         z-index:20;display:none;flex-direction:column;padding:18px 16px 26px}
  .focus.on{display:flex}
  .fhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .fback{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
  .fexit{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
  .ftitle{font-size:16px;font-weight:800;letter-spacing:.4px}
  .fbody{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:10px;text-align:center;overflow:hidden;padding-top:6px}
  .mic{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fbbf24,#ea580c);
       display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto;
       box-shadow:0 0 0 0 rgba(245,158,11,.55);animation:pulse 1.9s infinite}
  .mic.listen{animation:pulse 1.1s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(245,158,11,.55)}
    70%{box-shadow:0 0 0 20px rgba(245,158,11,0)}
    100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}
  }
  .flist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;text-align:left;padding:2px}
  .fitem{background:rgba(255,255,255,.08);border-radius:12px;padding:11px 14px}
  .fitem.live{background:rgba(255,255,255,.16)}
  .fitem.live .fi-o{font-size:27px}
  .fi-s{font-size:15px;opacity:.72;line-height:1.35}
  .fi-m{font-size:16px;color:#fcd34d;line-height:1.4;margin-top:3px}
  .fi-o{font-size:22px;font-weight:700;line-height:1.38;margin-top:5px}
  .fcur{display:none}
  .fsrc{font-size:17px;opacity:.82;max-width:96%;line-height:1.4;min-height:24px;margin:0 auto}
  .fout{font-size:26px;font-weight:800;line-height:1.35;max-width:96%;min-height:34px;margin:0 auto}
  .fstatus{font-size:13px;color:#fbbf24;font-weight:700}
  .fstop{background:#dc2626;color:#fff;border:none;border-radius:14px;padding:15px;font-size:16.5px;font-weight:800;margin-top:10px}
  .fdone{background:#16a34a;color:#fff;border:none;border-radius:14px;padding:15px;font-size:16.5px;font-weight:800;margin-top:10px}
  @media(max-width:520px){ .btn{min-width:0} header h1{font-size:20px} }
</style>
</head>
<body>
<header>
  <h1>離線粵英翻譯</h1>
  <p>粵語 ⇄ English　·　普通話做中間層　·　整句構造　·　離線翻譯＋朗讀</p>
</header>

<div class="wrap">
  <div class="dir">
    <button id="d2e" aria-pressed="true">粵語 <small>收音 → 普通話 → English</small></button>
    <button id="e2d" aria-pressed="false">English <small>收音 → 普通話 → 粵語</small></button>
  </div>
  <button class="auto" id="auto" aria-pressed="false">▶ 即時語音翻譯：粵語 → English</button>
  <div class="status" id="status"></div>
  <div class="devline" id="devline"></div>

  <div class="panel">
    <label class="mini">原文（收音或鍵盤輸入）</label>
    <textarea id="src" placeholder="例如：唔該幫我睇下個冷氣，個冷氣唔凍"></textarea>
    <div class="row">
      <button class="btn" id="go">翻譯</button>
      <button class="btn ghost" id="mic">🎤 收音一次</button>
    </div>
  </div>

  <div class="panel">
    <label class="mini">普通話構思（中間層，句子先執齊）</label>
    <div class="out mid" id="mid">—</div>
  </div>

  <div class="panel">
    <label class="mini">譯文</label>
    <div class="tag" id="tag">整句對譯</div>
    <div class="out empty" id="out">輸入內容後按「翻譯」</div>
    <div class="row">
      <button class="btn ghost" id="speak">🔊 朗讀</button>
      <button class="btn ghost" id="autoread" aria-pressed="true">🔁 自動朗讀：開</button>
      <button class="btn ghost" id="copy">複製</button>
      <button class="btn ghost" id="clear">清空</button>
    </div>
  </div>

  <h2 class="sec">常用句</h2>
  <div class="chips" id="chips"></div>

  <div class="row" style="margin-top:14px">
    <button class="btn ghost" id="vtest">🔈 測試發聲</button>
  </div>

  <p class="note" id="note"></p>
</div>

<div class="focus" id="focus" aria-hidden="true">
  <div class="fhead">
    <button class="fback" id="fback">← 返回</button>
    <div class="ftitle" id="ftitle">粵語 → English</div>
    <button class="fexit" id="fexit">✕ 退出</button>
  </div>
  <div class="fbody">
    <div class="mic" id="micRing"><span>🎤</span></div>
    <div class="flist" id="fList"></div>
    <div class="fcur">
      <div class="fsrc" id="fSrc">—</div>
      <div class="fout" id="fOut">—</div>
    </div>
    <div class="fstatus" id="fStatus">準備中…</div>
  </div>
  <button class="fdone" id="fDone">✓ 講完 · 翻譯</button>
  <button class="fstop" id="fstop">■ 停止</button>
</div>

<div class="toast" id="toast"></div>

function longestReplace(src,dict,maxLen){
  var out=[],i=0,changed=false, s=String(src||'');
  while(i<s.length){
    var hit=null,L=0;
    for(var len=Math.min(maxLen,s.length-i);len>=1;len--){
      var seg=s.substr(i,len);
      if(Object.prototype.hasOwnProperty.call(dict,seg)){ hit=dict[seg]; L=len; break; }
    }
    if(hit!==null){ out.push(hit); i+=L; changed=true; }
    else { out.push(s.charAt(i)); i++; }
  }
  return {text:out.join(''),changed:changed};
}

function en2zhCore(s){

  if(hz && hz/(raw.replace(/\s+/g,'').length||1)>=0.4){
    var cm=mandToCant(raw);
    return {mid:raw, out:(cm||raw), exact:true, struct:false};
  }
  var key=normKey(raw);
  if(TRI_E[key]){ var r=TRI_E[key]; return {mid:r[1],out:r[0],exact:true}; }
  var eb=enBilTry(raw);
  if(eb) return eb;
  var cp=parseEnCompound(raw);
  if(cp) return cp;
  var st=parseEnStruct(raw);
  if(st) return st;
  var mid=enToMand(raw);
  var cant=mandToCant(mid);
  if(/[A-Za-z]{2,}/.test(cant) || !/[\u4e00-\u9fa5]/.test(cant)){
    return {mid:mid, out:'', exact:false, struct:false};

function fetchJSON(url,ms){
  return new Promise(function(res,rej){
    var done=false, timer=setTimeout(function(){ if(!done){ done=true; rej(new Error('timeout')); } }, ms||2600);
    fetch(url,{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){

function onlineTranslate(text,d){

    +'&langpair='+(d==='zh2en'?'zh-TW|en':'en|zh-TW');
  return fetchJSON(gurl,2600).then(function(j){
    var s='';
    if(j&&j[0]&&j[0].length){ for(var i=0;i<j[0].length;i++){ if(j[0][i]&&j[0][i][0]) s+=j[0][i][0]; } }
    if(s.trim()) return s.trim();

  }).catch(function(){
    return fetchJSON(murl,2600).then(function(j){

function pickVoice(lang){
  var vs=speechSynthesis.getVoices()||[],cands=[],i,v;
  if(lang.indexOf('zh')===0){
    var wantHK=/HK/i.test(lang);
    for(i=0;i<vs.length;i++){
      v=vs[i]; var nm=(v.name||'')+' '+(v.lang||'');
      if(wantHK && (/zh[-_]?HK/i.test(v.lang||'')||/Cantonese|Yue|粵/i.test(nm))) cands.push(v);
    }
    if(!cands.length){ for(i=0;i<vs.length;i++){ if(/^zh/i.test(vs[i].lang||'')) cands.push(vs[i]); } }
    else { for(i=0;i<cands.length;i++){ if(cands[i].localService){ var lv=cands[i]; cands.splice(i,1); cands.unshift(lv); break; } } return cands[0]||null; }
  } else if(lang.indexOf('en')===0){
    var wantUS=/US/i.test(lang);
    for(i=0;i<vs.length;i++){
      v=vs[i]; if(!/^en/i.test(v.lang||'')) continue;
      if(wantUS && /^en[-_]?US/i.test(v.lang||'')) cands.unshift(v); else cands.push(v);
    }
  }

var ttsAudio=null;
function unlockAudio(){
  if(ttsAudio) return;
  try{
    ttsAudio=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
    ttsAudio.volume=0;
    var p=ttsAudio.play();
    if(p&&p.catch) p.catch(function(){});
  }catch(e){}
}
function audioSpeak(txt,lang,onDone){
  var t=String(txt||'').trim();
  if(!t){ if(onDone) onDone(false); return; }
  if(t.length>180) t=t.slice(0,180);
  var en=/^en/i.test(lang), enc=encodeURIComponent(t);
  var urls = en
    ? ['https://dict.youdao.com/dictvoice?type=1&audio='+enc,
       'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q='+enc]
    : ['https://dict.youdao.com/dictvoice?type=2&audio='+enc,
       'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-TW&q='+enc];
  var i=0, done=false;
  function next(){
    if(done) return;
    if(i>=urls.length){ done=true; if(onDone) onDone(false); return; }
    if(!ttsAudio) unlockAudio();
    if(!ttsAudio){ done=true; if(onDone) onDone(false); return; }
    try{
      ttsAudio.onended=function(){ if(done) return; done=true; if(onDone) onDone(true); };
      ttsAudio.onerror=function(){ next(); };
      ttsAudio.src=urls[i++];
      ttsAudio.volume=1;
      var p=ttsAudio.play();
      if(p&&p.catch) p.catch(function(){ next(); });
    }catch(e){ next(); }
  }
  next();
}
function speakText(txt,lang,cb){
  var finished=false;
  function fin(ok){ if(finished) return; finished=true; if(cb)cb(ok); }
  var t=String(txt||'').trim();
  if(!t){ fin(false); return; }
  try{ unlockAudio(); }catch(e){}
  if('speechSynthesis' in window){
    try{ speechSynthesis.cancel(); }catch(e){}
    var started=false, guard=null;
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang; u.rate=0.95; u.volume=1;
    var v=pickVoice(lang);
    if(v){ try{ u.voice=v; u.lang=v.lang||lang; }catch(e){} }
    u.onstart=function(){ started=true; if(guard) clearTimeout(guard); };
    u.onend=function(){ if(guard) clearTimeout(guard); fin(true); };
    u.onerror=function(){ if(guard) clearTimeout(guard); audioSpeak(t,lang,function(ok){ if(!ok) toast('朗讀失敗，請檢查網絡或系統語音包'); fin(ok); }); };
    try{ speechSynthesis.speak(u); }
    catch(e){ audioSpeak(t,lang,function(ok){ if(!ok) toast('朗讀失敗，請檢查網絡或系統語音包'); fin(ok); }); return; }
    guard=setTimeout(function(){
      if(started||finished) return;
      try{ speechSynthesis.cancel(); }catch(e){}
      audioSpeak(t,lang,function(ok){ if(!ok) toast('朗讀失敗，請檢查網絡或系統語音包'); fin(ok); });
    },900);
  } else {
    audioSpeak(t,lang,function(ok){ if(!ok) toast('朗讀失敗，請檢查網絡或系統語音包'); fin(ok); });
  }
}

$('fDone').onclick=function(){
  var stopped=false;
  try{ if(rec && autoOn){ rec.stop(); stopped=true; } }catch(e){}
  if(!stopped){
    var v=$('src').value.trim();
    if(v) translate(); else toast('未在收音');
  }
};

$('autoread').onclick=function(){
  autoRead=!autoRead;
  this.setAttribute('aria-pressed', autoRead?'true':'false');
  this.textContent = autoRead?'🔁 自動朗讀：開':'🔁 自動朗讀：關';
};
