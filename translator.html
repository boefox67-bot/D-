<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>離線粵英翻譯</title>
<style>
  :root{
    --ink:#0f2a44; --ink2:#163a5c; --amber:#f59e0b; --orange:#ea580c;
    --bg:#f4f7fb; --card:#ffffff; --line:#dbe4ee; --muted:#64748b; --ok:#0f766e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"PingFang HK","PingFang SC","Microsoft JhengHei","Microsoft YaHei",system-ui,sans-serif;
       line-height:1.55}
  header{background:linear-gradient(160deg,#0f2a44,#163a5c 60%,#1d4a72);color:#fff;padding:22px 18px 26px;
         border-bottom-left-radius:22px;border-bottom-right-radius:22px}
  header h1{margin:0;font-size:22px;letter-spacing:.5px}
  header p{margin:6px 0 0;font-size:13px;opacity:.78}
  .wrap{padding:16px 14px 40px;max-width:760px;margin:0 auto}
  .dir{display:flex;gap:8px;margin-bottom:12px}
  .dir button{flex:1;padding:11px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
              color:var(--ink);font-size:14px;font-weight:700;cursor:pointer}
  .dir button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1a1207}
  .panel{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(15,42,68,.07);margin-bottom:14px}
  label.mini{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  textarea{width:100%;min-height:96px;padding:12px;border:1.5px solid var(--line);border-radius:12px;
           font-size:17px;line-height:1.5;resize:vertical;font-family:inherit;color:var(--ink);background:#fbfdff}
  textarea:focus{outline:none;border-color:var(--amber);background:#fff}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{border:none;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:800;cursor:pointer;
       background:var(--orange);color:#fff;flex:1;min-width:110px}
  .btn.ghost{background:#eef3f9;color:var(--ink);font-weight:700}
  .btn.ghost:active{background:#e2e9f2}
  .out{background:#fbfdff;border:1.5px dashed var(--line);border-radius:14px;padding:14px;
       font-size:19px;min-height:88px;word-break:break-word;color:#0b2540}
  .out.empty{color:#9aa9b8;font-size:15px}
  .norm{font-size:12.5px;color:#7c8b9a;margin-top:8px;line-height:1.5;display:none}
  .tag{display:inline-block;font-size:12px;color:var(--ok);background:#e6f4f1;border-radius:8px;padding:2px 8px;margin-bottom:8px}
  .auto{margin-top:10px;width:100%;border:1.5px solid var(--orange);background:#fff;color:var(--orange);
        border-radius:12px;padding:11px;font-size:14.5px;font-weight:800;cursor:pointer}
  .auto[aria-pressed="true"]{background:var(--orange);color:#fff}
  .devline{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13.5px;
        color:var(--ink);cursor:pointer}
  .chip:active{background:#fff7e6;border-color:var(--amber)}
  h2.sec{font-size:13px;color:var(--muted);font-weight:700;margin:18px 2px 8px;letter-spacing:.4px}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(15,42,68,.94);color:#fff;
         padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s}
  .toast.show{opacity:1}
  @media(max-width:520px){ .btn{min-width:0} header h1{font-size:20px} }
</style>
</head>
<body>
<header>
  <h1>離線粵英翻譯</h1>
  <p>粵語（香港）⇄ 英文　·　離線可用　·　內置電工／工程／職場用語</p>
</header>

<div class="wrap">
  <div class="dir">
    <button id="d2e" aria-pressed="true">粵 → 英</button>
    <button id="e2d" aria-pressed="false">英 → 粵</button>
  </div>
  <button class="auto" id="auto" aria-pressed="false">▶ 即時對話（講完自動翻譯＋自動朗讀，雙向輪替）</button>
  <div class="devline" id="devline"></div>

  <div class="panel">
    <label class="mini">輸入</label>
    <textarea id="src" placeholder="例如：唔該幫我睇下個冷氣，好似唔凍"></textarea>
    <div class="row">
      <button class="btn" id="go">翻譯</button>
      <button class="btn ghost" id="mic">🎤 語音輸入</button>
    </div>
  </div>

  <div class="panel">
    <label class="mini">結果</label>
    <div class="tag" id="tag">詞庫翻譯</div>
    <div class="out empty" id="out">輸入內容後按「翻譯」</div>
    <div class="norm" id="norm"></div>
    <div class="row">
      <button class="btn ghost" id="speak">🔊 朗讀</button>
      <button class="btn ghost" id="copy">複製</button>
      <button class="btn ghost" id="clear">清空</button>
    </div>
  </div>

  <h2 class="sec">常用句</h2>
  <div class="chips" id="chips"></div>

  <p class="note" id="note"></p>
</div>

<div class="toast" id="toast"></div>

/* ========= 翻譯引擎 ========= */
function normCant(s){
  var src=String(s||'').replace(/[\s\u3000]+/g,'');
  var out=[],i=0,changed=false;
  while(i<src.length){
    var hit=null,L=0;
    for(var len=Math.min(6,src.length-i);len>=1;len--){
      var seg=src.substr(i,len);
      if(Object.prototype.hasOwnProperty.call(CANT2MAND,seg)){ hit=CANT2MAND[seg]; L=len; break; }
    }
    if(hit!==null){ out.push(hit); i+=L; changed=true; }
    else { out.push(src.charAt(i)); i++; }
  }
  return {text:out.join(''),changed:changed};
}
function segTrans(str,maxLen){
  var out=[],i=0,unknown=0;
  while(i<str.length){
    var hit=null,L=0;
    for(var len=Math.min(maxLen,str.length-i);len>=1;len--){
      var seg=str.substr(i,len);
      if(Object.prototype.hasOwnProperty.call(T,seg)){ hit=T[seg]; L=len; break; }
    }
    if(hit!==null){ if(hit!=='') out.push(hit); i+=L; }
    else { out.push(str.charAt(i)); unknown++; i++; }
  }
  var text=out.join(' ').replace(/\s+/g,' ').replace(/ ([,，。；;:：!！?？])/g,'$1').trim();
  return {text:text,unknown:unknown,len:str.length};
}
/* 粵語 → 書面語（普通話）→ 英文：兩段式翻譯 */
function normCant(s){
  var src=String(s||'').replace(/[\s\u3000]+/g,'');
  var out=[],i=0,changed=false;
  while(i<src.length){
    var hit=null,L=0,maxLen=Math.min(7,src.length-i);
    for(var len=maxLen;len>=1;len--){
      var seg=src.substr(i,len);
      if(Object.prototype.hasOwnProperty.call(CANT2MAND,seg)){ hit=CANT2MAND[seg]; L=len; break; }
    }
    if(hit!==null){ out.push(hit); i+=L; changed=true; }
    else { out.push(src.charAt(i)); i++; }
  }
  return {text:out.join(''),changed:changed};
}
function segTrans(str,maxLen){
  var out=[],i=0,unknown=0;
  while(i<str.length){
    var hit=null,L=0;
    for(var len=Math.min(maxLen,str.length-i);len>=1;len--){
      var seg=str.substr(i,len);
      if(Object.prototype.hasOwnProperty.call(T,seg)){ hit=T[seg]; L=len; break; }
    }
    if(hit!==null){ if(hit!=='') out.push(hit); i+=L; }
    else { out.push(str.charAt(i)); unknown++; i++; }
  }
  var text=out.join(' ').replace(/\s+/g,' ').replace(/ ([,，。；;:：!！?？])/g,'$1').trim();
  return {text:text,unknown:unknown,len:str.length};
}
function trZH(s){
  var raw=String(s||'').replace(/[\s\u3000]+/g,'');
  if(Object.prototype.hasOwnProperty.call(T,raw)){
    return {text:T[raw],unknown:0,usedNorm:false,norm:raw,len:raw.length};
  }
  var n=normCant(raw);
  var r=segTrans(n.text,12);
  return {text:r.text,unknown:r.unknown,usedNorm:n.changed,norm:n.text,len:r.len};
}
function trEN(s){
  var toks=(String(s||'').toLowerCase().match(/[a-z0-9']+/g))||[];
  var out=[],i=0,unknown=0;
  while(i<toks.length){
    var hit=null,L=0,maxLen=Math.min(4,toks.length-i);
    for(var len=maxLen;len>=1;len--){
      var seg=toks.slice(i,i+len).join(' ');
      if(Object.prototype.hasOwnProperty.call(EN2ZH,seg)){ hit=EN2ZH[seg]; L=len; break; }
    }
    if(hit!==null){ if(hit!=='') out.push(hit); i+=L; }else{ out.push(toks[i]); unknown++; i++; }
  }
  return {text:out.join('').trim(),unknown:unknown};
}

/* ========= 介面 ========= */
var dir='zh2en', lastOut='', lastLang='en-US';
var $=function(id){return document.getElementById(id);};
function toast(msg){ var t=$('toast'); t.textContent=msg; t.className='toast show'; clearTimeout(window._tt); window._tt=setTimeout(function(){t.className='toast';},1600); }
function setDir(d){
  dir=d;
  $('d2e').setAttribute('aria-pressed', d==='zh2en'?'true':'false');
  $('e2d').setAttribute('aria-pressed', d==='en2zh'?'true':'false');
  $('src').placeholder = d==='zh2en' ? '例如：唔該幫我睇下個冷氣，好似唔凍' : 'e.g. Please check the air conditioner';
  $('out').className='out empty';
  $('out').textContent = d==='zh2en' ? '輸入粵語後按「翻譯」' : 'Enter English then press Translate';
  $('tag').textContent='詞庫翻譯';
  lastOut='';
}
function run(){
  var v=$('src').value.trim();
  if(!v){ toast('請先輸入內容'); return; }
  var hasCJK=/[\u4e00-\u9fff]/.test(v);
  if(dir==='en2zh' && hasCJK) setDir('zh2en');
  if(dir==='zh2en' && !hasCJK) setDir('en2zh');
  var r = dir==='zh2en' ? trZH(v) : trEN(v);
  lastOut=r.text;
  lastLang = dir==='zh2en' ? 'en-US' : 'zh-HK';
  var out=$('out'); out.className='out'; out.textContent=r.text;
  var ratio = r.text ? r.unknown/Math.max(1, (r.len || v.length)) : 0;
  var normBox=$('norm');
  if(dir==='zh2en' && r.usedNorm && r.norm && r.norm!==v){
    normBox.style.display='block'; normBox.textContent='普通話（書面語）：'+r.norm;
  }else{ normBox.style.display='none'; normBox.textContent=''; }
  if(!r.text){ out.className='out empty'; out.textContent='（詞庫未能處理，請拆短句試下）'; }
  else if(ratio>0.35){ $('tag').textContent='部分字詞未收錄（保留原文）'; }
  else if(ratio>0){ $('tag').textContent='已翻譯（個別字詞未收錄）'; }
  else { $('tag').textContent='已完整翻譯'; }
}
function speak(){
  if(!lastOut){ toast('未有結果可朗讀'); return; }
  if(!('speechSynthesis' in window)){ toast('此裝置唔支援朗讀'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var u=new SpeechSynthesisUtterance(lastOut);
  u.lang=lastLang; u.rate=0.95;
  var vs=speechSynthesis.getVoices()||[];
  var best=null;
  for(var i=0;i<vs.length;i++){
    var v=vs[i], tag=(v.lang||'')+' '+(v.name||'');
    if(lastLang.indexOf('zh')===0 && /zh[-_]?(HK|TW)|Cantonese|粵|Yue/i.test(tag)){ best=v; break; }
    if(lastLang.indexOf('en')===0 && /^en(-|_)?(US|GB)?/i.test(v.lang||'')){ best=best||v; }
  }
  if(best) u.voice=best;
  speechSynthesis.speak(u);
  toast('朗讀中');
}
var rec=null;
function mic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('此裝置唔支援語音輸入，請用鍵盤'); return; }
  if(rec){ try{rec.stop();}catch(e){} rec=null; return; }
  rec=new SR();
  rec.lang = dir==='zh2en' ? 'yue-Hant-HK' : 'en-US';
  rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult=function(e){ var t=e.results[0][0].transcript; $('src').value=t; run(); };
  rec.onerror=function(e){ toast('語音輸入失敗：'+(e.error||'unknown')); rec=null; };
  rec.onend=function(){ toast('語音輸入完成'); rec=null; };
  try{ rec.start(); toast('請講…'); }catch(e){ toast('無法啟動語音輸入'); rec=null; }
}
var autoOn=false, autoLang='zh2en';
function speakText(txt,lang,cb){
  if(!('speechSynthesis' in window)){ if(cb)cb(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var u=new SpeechSynthesisUtterance(txt);
  u.lang=lang; u.rate=0.95;
  var vs=speechSynthesis.getVoices()||[], best=null;
  for(var i=0;i<vs.length;i++){
    var v=vs[i], tg=(v.lang||'')+' '+(v.name||'');
    if(lang.indexOf('zh')===0 && /zh[-_]?(HK|TW)|Cantonese|Yue|粵/i.test(tg)){ best=v; break; }
    if(lang.indexOf('en')===0 && /^en/i.test(v.lang||'')){ best=best||v; }
  }
  if(best) u.voice=best;
  u.onend=function(){ if(cb)cb(); };
  speechSynthesis.speak(u);
}
function listenOnce(onText){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('此裝置唔支援語音識別'); autoStop(); return; }
  try{ if(rec) rec.stop(); }catch(e){}
  rec=new SR();
  rec.lang = autoLang==='zh2en' ? 'yue-Hant-HK' : 'en-US';
  rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult=function(e){ var t=e.results[0][0].transcript; onText(t); };
  rec.onerror=function(e){ if(e.error==='no-speech'){ if(autoOn) setTimeout(listenOnce.bind(null,onText),800); return; } toast('識別失敗：'+(e.error||'')); rec=null; if(autoOn) autoStop(); };
  rec.onend=function(){ if(autoOn && !window._recGot) setTimeout(function(){ if(autoOn && !window._recGot) listenOnce(onText); },700); };
  window._recGot=false;
  try{ rec.start(); }catch(e){ toast('無法啟動語音輸入'); rec=null; }
}
function autoTurn(){
  if(!autoOn) return;
  setDir(autoLang);
  $('tag').textContent='等候你講'+(autoLang==='zh2en'?'粵語':'英文')+'…';
  listenOnce(function(t){
    window._recGot=true;
    $('src').value=t;
    run();
    var say=lastOut, sayLang=(autoLang==='zh2en'?'en-US':'zh-HK');
    $('tag').textContent='朗讀中（'+(autoLang==='zh2en'?'英文':'粵語')+'）';
    speakText(say, sayLang, function(){
      if(!autoOn) return;
      autoLang = autoLang==='zh2en' ? 'en2zh' : 'zh2en';
      setTimeout(autoTurn, 350);
    });
  });
}
function autoStop(){ autoOn=false; try{ if(rec) rec.stop(); }catch(e){} rec=null; $('auto').setAttribute('aria-pressed','false'); $('auto').textContent='▶ 即時對話（講完自動翻譯＋自動朗讀，雙向輪替）'; }
function toggleAuto(){
  if(autoOn){ autoStop(); toast('已停止'); return; }
  autoOn=true; autoLang='zh2en';
  $('auto').setAttribute('aria-pressed','true');
  $('auto').textContent='■ 停止即時對話';
  toast('請講粵語');
  autoTurn();
}
function refreshDev(){
  var box=$('devline');
  if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices){ box.textContent='此裝置無法列出音訊裝置。'; return; }
  navigator.mediaDevices.enumerateDevices().then(function(list){
    var outs=list.filter(function(d){return d.kind==='audiooutput';}).map(function(d){return d.label||'系統預設';});
    var ins=list.filter(function(d){return d.kind==='audioinput';}).map(function(d){return d.label||'系統預設';});
    var all=outs.concat(ins).join(' ');
    var hp=/藍牙|蓝牙|Bluetooth|耳機|耳机|Headset|AirPods/i.test(all);
    box.innerHTML='輸出：'+(outs.join('、')||'由系統決定')+'　·　輸入：'+(ins.join('、')||'由系統決定')+
      (hp?'　<br>已偵測耳機／藍牙：系統會把聲音送去耳機；要用手機喇叭出聲，請先斷開藍牙或拔耳機。':'');
  }).catch(function(){ box.textContent='（裝置清單需授權後才顯示）'; });
}

function copyOut(){

  if(!lastOut){ toast('未有結果'); return; }
  var done=function(){ toast('已複製'); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(lastOut).then(done,function(){ fallbackCopy(); }); }
  else fallbackCopy();
  function fallbackCopy(){
    var ta=document.createElement('textarea'); ta.value=lastOut; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('複製失敗，請長按選取'); }
    ta.remove();
  }
}
