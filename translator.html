<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>離線粵英翻譯</title>
<style>
  :root{
    --ink:#0f2a44; --ink2:#163a5c; --amber:#f59e0b; --orange:#ea580c;
    --bg:#f4f7fb; --card:#ffffff; --line:#dbe4ee; --muted:#64748b; --ok:#0f766e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"PingFang HK","PingFang SC","Microsoft JhengHei","Microsoft YaHei",system-ui,sans-serif;
       line-height:1.55}
  header{background:linear-gradient(160deg,#0f2a44,#163a5c 60%,#1d4a72);color:#fff;padding:22px 18px 26px;
         border-bottom-left-radius:22px;border-bottom-right-radius:22px}
  header h1{margin:0;font-size:22px;letter-spacing:.5px}
  header p{margin:6px 0 0;font-size:13px;opacity:.78}
  .wrap{padding:16px 14px 40px;max-width:760px;margin:0 auto}
  .dir{display:flex;gap:8px;margin-bottom:10px}
  .dir button{flex:1;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
              color:var(--ink);font-size:14.5px;font-weight:800;cursor:pointer;line-height:1.25}
  .dir button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1a1207}
  .dir button small{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:2px}
  .panel{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(15,42,68,.07);margin-bottom:14px}
  label.mini{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  textarea{width:100%;min-height:92px;padding:12px;border:1.5px solid var(--line);border-radius:12px;
           font-size:17px;line-height:1.5;resize:vertical;font-family:inherit;color:var(--ink);background:#fbfdff}
  textarea:focus{outline:none;border-color:var(--amber);background:#fff}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{border:none;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:800;cursor:pointer;
       background:var(--orange);color:#fff;flex:1;min-width:110px}
  .btn.ghost{background:#eef3f9;color:var(--ink);font-weight:700}
  .btn.ghost:active{background:#e2e9f2}
  .out{background:#fbfdff;border:1.5px dashed var(--line);border-radius:14px;padding:13px;
       font-size:19px;min-height:64px;word-break:break-word;color:#0b2540}
  .out.mid{font-size:16px;color:#3c556e;min-height:52px;background:#f7fafc}
  .out.empty{color:#9aa9b8;font-size:15px}
  .tag{display:inline-block;font-size:12px;color:var(--ok);background:#e6f4f1;border-radius:8px;padding:2px 8px;margin-bottom:8px}
  .auto{margin-top:10px;width:100%;border:1.5px solid var(--orange);background:#fff;color:var(--orange);
        border-radius:12px;padding:12px;font-size:15px;font-weight:800;cursor:pointer}
  .auto[aria-pressed="true"]{background:var(--orange);color:#fff}
  .devline{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13.5px;
        color:var(--ink);cursor:pointer}
  .chip:active{background:#fff7e6;border-color:var(--amber)}
  h2.sec{font-size:13px;color:var(--muted);font-weight:700;margin:18px 2px 8px;letter-spacing:.4px}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
  .status{font-size:12.5px;color:var(--orange);font-weight:700;margin-top:8px;min-height:18px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(15,42,68,.94);color:#fff;
         padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:9}
  .toast.show{opacity:1}
  @media(max-width:520px){ .btn{min-width:0} header h1{font-size:20px} }
</style>
</head>
<body>
<header>
  <h1>離線粵英翻譯</h1>
  <p>粵語 ⇄ English　·　普通話做中間層　·　整句構造　·　離線翻譯＋朗讀</p>
</header>

<div class="wrap">
  <div class="dir">
    <button id="d2e" aria-pressed="true">粵語 <small>收音 → 普通話 → English</small></button>
    <button id="e2d" aria-pressed="false">English <small>收音 → 普通話 → 粵語</small></button>
  </div>
  <button class="auto" id="auto" aria-pressed="false">▶ 即時翻譯（鎖定語言，講完自動翻譯＋朗讀）</button>
  <div class="status" id="status"></div>
  <div class="devline" id="devline"></div>

  <div class="panel">
    <label class="mini">原文（收音或鍵盤輸入）</label>
    <textarea id="src" placeholder="例如：唔該幫我睇下個冷氣，個冷氣唔凍"></textarea>
    <div class="row">
      <button class="btn" id="go">翻譯</button>
      <button class="btn ghost" id="mic">🎤 收音一次</button>
    </div>
  </div>

  <div class="panel">
    <label class="mini">普通話構思（中間層，句子先執齊）</label>
    <div class="out mid" id="mid">—</div>
  </div>

  <div class="panel">
    <label class="mini">譯文</label>
    <div class="tag" id="tag">整句對譯</div>
    <div class="out empty" id="out">輸入內容後按「翻譯」</div>
    <div class="row">
      <button class="btn ghost" id="speak">🔊 朗讀</button>
      <button class="btn ghost" id="copy">複製</button>
      <button class="btn ghost" id="clear">清空</button>
    </div>
  </div>

  <h2 class="sec">常用句</h2>
  <div class="chips" id="chips"></div>

  <div class="row" style="margin-top:14px">
    <button class="btn ghost" id="vtest">🔈 測試發聲</button>
  </div>

  <p class="note" id="note"></p>
</div>

<div class="toast" id="toast"></div>

function longestReplace(src,dict,maxLen){
  var out=[],i=0,changed=false, s=String(src||'');
  while(i<s.length){
    var hit=null,L=0;
    for(var len=Math.min(maxLen,s.length-i);len>=1;len--){
      var seg=s.substr(i,len);
      if(Object.prototype.hasOwnProperty.call(dict,seg)){ hit=dict[seg]; L=len; break; }
    }
    if(hit!==null){ out.push(hit); i+=L; changed=true; }
    else { out.push(s.charAt(i)); i++; }
  }
  return {text:out.join(''),changed:changed};
}
function cleanMand(t){
  return String(t||'').replace(/[\s\u3000]+/g,'').replace(/，+/g,'，').replace(/^，|，$/g,'').replace(/。+$/,'');

  t=String(t||'').replace(/\s+/g,' ').replace(/\s+([,.;:!?])/g,'$1').trim();
  if(t){ t=t.charAt(0).toUpperCase()+t.slice(1); if(!/[.!?]$/.test(t)) t+='.'; }
  return t;
}

function enToMand(s){
  var raw=String(s||'').trim();
  if(!raw) return '';

  var out=[],i=0;
  while(i<toks.length){
    var hit=null,L=0;
    for(var len=Math.min(4,toks.length-i);len>=1;len--){
      var seg=toks.slice(i,i+len).join(' ');
      if(Object.prototype.hasOwnProperty.call(EN2MAND,seg)){ hit=EN2MAND[seg]; L=len; break; }
    }
    if(hit!==null){ out.push(hit); i+=L; } else { out.push(toks[i]); i++; }
  }
  return cleanMand(out.join(''));
}

function parseEnCompound(t){

  var main=parseEnStruct(m[1]);
  if(!main || !main.objMand || !main.objCant) return null;
  var key=(m[2]?'not ':'')+m[3].toLowerCase();
  var st=E_STATE[key]||E_STATE[m[3].toLowerCase()];
  if(!st) return null;
  return {mid:main.mid+'，它'+st[0], out:cleanCant(main.out+'，佢'+st[1]), exact:false, struct:true};
}
function en2zh(s){
  var raw=String(s||'').trim();
  if(!raw) return {mid:'',out:''};
  var key=normKey(raw);
  if(TRI_E[key]){ var r=TRI_E[key]; return {mid:r[1],out:r[0],exact:true}; }
  var cp=parseEnCompound(raw);
  if(cp) return cp;
  var st=parseEnStruct(raw);
  if(st) return st;
  var mid=enToMand(raw);
  var cant=mandToCant(mid);
  return {mid:mid,out:cant,exact:false,struct:false};
}

/* ========= 介面 ========= */
var dir='zh2en', lastOut='', lastLang='en-US', lastMid='';
var $=function(id){return document.getElementById(id);};
function toast(msg){ var t=$('toast'); t.textContent=msg; t.className='toast show'; clearTimeout(window._tt); window._tt=setTimeout(function(){t.className='toast';},1600); }
function setDir(d){
  dir=d;
  $('d2e').setAttribute('aria-pressed', d==='zh2en'?'true':'false');
  $('e2d').setAttribute('aria-pressed', d==='en2zh'?'true':'false');
  $('src').placeholder = d==='zh2en' ? '例如：唔該幫我睇下個冷氣，個冷氣唔凍' : 'e.g. Please check the air conditioner, it is not cooling.';
  $('out').className='out empty';
  $('out').textContent = d==='zh2en' ? '輸入粵語後按「翻譯」' : 'Enter English then press Translate';
  $('mid').textContent='—';
  $('tag').textContent='整句對譯';
  $('status').textContent = d==='zh2en' ? '鎖定：所有收音當粵語處理 → 普通話構思 → English' : '鎖定：所有收音當英文處理 → 普通話構思 → 粵語';
  lastOut=''; lastMid=''; lastLang = d==='zh2en' ? 'en-US' : 'zh-HK';
}
function translate(){
  var v=$('src').value.trim();
  if(!v){ toast('請先輸入內容'); return; }
  var r = dir==='zh2en' ? zh2en(v) : en2zh(v);
  lastMid=r.mid; lastOut=r.out;
  lastLang = dir==='zh2en' ? 'en-US' : 'zh-HK';
  $('mid').textContent = r.mid || '—';
  var out=$('out');
  out.className='out'; out.textContent = r.out || '（未能翻譯）';
  if(!r.out){ out.className='out empty'; out.textContent='（未能翻譯，請拆短句試下）'; }
  $('tag').textContent = r.exact ? '整句對譯' : (r.struct ? '句式重組' : '詞庫組合');
}
function pickVoice(lang){
  var vs=speechSynthesis.getVoices()||[],cands=[],i,v;
  if(lang.indexOf('zh')===0){
    var wantHK=/HK/i.test(lang);
    for(i=0;i<vs.length;i++){
      v=vs[i]; var nm=(v.name||'')+' '+(v.lang||'');
      if(wantHK && (/zh[-_]?HK/i.test(v.lang||'')||/Cantonese|Yue|粵/i.test(nm))) cands.push(v);
    }
    if(!cands.length){ for(i=0;i<vs.length;i++){ if(/^zh/i.test(vs[i].lang||'')) cands.push(vs[i]); } }
    else { for(i=0;i<cands.length;i++){ if(cands[i].localService){ var lv=cands[i]; cands.splice(i,1); cands.unshift(lv); break; } } return cands[0]||null; }
  } else if(lang.indexOf('en')===0){
    var wantUS=/US/i.test(lang);
    for(i=0;i<vs.length;i++){
      v=vs[i]; if(!/^en/i.test(v.lang||'')) continue;
      if(wantUS && /^en[-_]?US/i.test(v.lang||'')) cands.unshift(v); else cands.push(v);
    }
  }
  for(i=0;i<cands.length;i++){ if(cands[i].localService) return cands[i]; }
  return cands[0]||null;
}
function unlockTTS(){
  try{ var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){}
}
function speakText(txt,lang,cb){
  if(!('speechSynthesis' in window)){ toast('此裝置冇語音引擎，無法朗讀'); if(cb)cb(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(function(){
    var u=new SpeechSynthesisUtterance(txt);
    u.lang=lang; u.rate=0.95;
    var v=pickVoice(lang);
    if(v){ u.voice=v; u.lang=v.lang; }
    var done=false;
    function fin(){ if(done) return; done=true; if(cb)cb(); }
    u.onend=fin;
    u.onerror=function(e){
      var err=(e&&e.error)||'';
      if(err==='not-allowed'){ toast('系統阻止朗讀，請再按一次「朗讀」'); }
      else if(err!=='interrupted'&&err!=='canceled'){ toast('朗讀失敗：'+err); }
      fin();
    };
    try{ speechSynthesis.resume(); speechSynthesis.speak(u); }
    catch(e){ toast('朗讀失敗'); fin(); }
  },120);
}
function voiceTest(){
  var box=$('status');
  if(!('speechSynthesis' in window)){ box.textContent='此裝置冇語音引擎，無法朗讀。'; return; }
  var vs=speechSynthesis.getVoices()||[];
  var zh=pickVoice('zh-HK'), en=pickVoice('en-US');
  box.textContent='語音 '+vs.length+' 個｜粵語：'+(zh?zh.name+(zh.localService?'（離線）':'（需聯網）'):'冇')+'｜英文：'+(en?en.name+(en.localService?'（離線）':'（需聯網）'):'冇');
  speakText(dir==='zh2en'?'This is a voice test.':'呢個係發聲測試。', dir==='zh2en'?'en-US':'zh-HK', function(){});
}
function speak(){
  if(!lastOut){ toast('未有結果可朗讀'); return; }
  speakText(lastOut,lastLang,function(){});
  toast('朗讀中');
}
var rec=null, autoOn=false, speaking=false;
function listenOnce(lang,onText){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('此裝置唔支援語音識別，請用鍵盤'); stopAuto(); return; }
  try{ if(rec) rec.abort(); }catch(e){}
  rec=new SR();
  rec.lang=lang; rec.interimResults=false; rec.maxAlternatives=1; rec.continuous=false;
  var got=false;
  rec.onresult=function(e){ got=true; var t=e.results[0][0].transcript; onText(t); };
  rec.onerror=function(e){
    if(e.error==='no-speech'){
      if(autoOn && !speaking) setTimeout(function(){ listenOnce(lang,onText); },700);
      return;
    }
    toast('識別失敗：'+(e.error||'unknown'));
    if(autoOn) stopAuto();
  };
  rec.onend=function(){
    if(autoOn && !got && !speaking) setTimeout(function(){ listenOnce(lang,onText); },700);
  };
  try{ rec.start(); }catch(e){ toast('無法啟動語音輸入'); }
}
function autoTurn(){
  if(!autoOn || speaking) return;
  var lang = dir==='zh2en' ? 'yue-Hant-HK' : 'en-US';
  $('status').textContent = (dir==='zh2en'?'等候你講粵語…':'等候你講英文…');
  listenOnce(lang,function(text){
    if(!autoOn) return;
    $('src').value=text;
    translate();
    $('status').textContent = '翻譯完成，朗讀'+(dir==='zh2en'?'英文':'粵語')+'…';
    speaking=true;
    speakText(lastOut,lastLang,function(){
      speaking=false;
      if(autoOn) setTimeout(autoTurn,450);
    });
  });
}
function startAuto(){
  autoOn=true; speaking=false;
  unlockTTS();
  $('auto').setAttribute('aria-pressed','true');
  $('auto').textContent='■ 停止即時翻譯';
  autoTurn();
}
function stopAuto(){
  autoOn=false; speaking=false;
  try{ if(rec) rec.abort(); }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  $('auto').setAttribute('aria-pressed','false');
  $('auto').textContent='▶ 即時翻譯（鎖定語言，講完自動翻譯＋朗讀）';
  $('status').textContent='已停止';
}
function toggleAuto(){ if(autoOn) stopAuto(); else startAuto(); }
function micOnce(){
  var lang = dir==='zh2en' ? 'yue-Hant-HK' : 'en-US';
  toast(dir==='zh2en'?'請講粵語…':'Please speak English…');
  listenOnce(lang,function(t){ $('src').value=t; translate(); });
}
function refreshDev(){
  var box=$('devline');
  if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices){ box.textContent='此裝置無法列出音訊裝置。'; return; }
  navigator.mediaDevices.enumerateDevices().then(function(list){
    var outs=list.filter(function(d){return d.kind==='audiooutput';}).map(function(d){return d.label||'系統預設';});
    var ins=list.filter(function(d){return d.kind==='audioinput';}).map(function(d){return d.label||'系統預設';});
    var all=outs.concat(ins).join(' ');
    var hp=/藍牙|蓝牙|Bluetooth|耳機|耳机|Headset|AirPods/i.test(all);
    box.innerHTML='輸出：'+(outs.join('、')||'由系統決定')+'　·　輸入：'+(ins.join('、')||'由系統決定')+
      (hp?'　<br>已偵測耳機／藍牙：系統會把聲音送去耳機；要用手機喇叭出聲，請先斷開藍牙或拔耳機。':'');
  }).catch(function(){ box.textContent='（裝置清單需授權後才顯示）'; });
}
function copyOut(){
  if(!lastOut){ toast('未有結果'); return; }
  var done=function(){ toast('已複製'); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(lastOut).then(done,function(){ fallbackCopy(); }); }
  else fallbackCopy();
  function fallbackCopy(){
    var ta=document.createElement('textarea'); ta.value=lastOut; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('複製失敗，請長按選取'); }
    ta.remove();
  }
}

/* ========= 常用句 chips ========= */
var CHIPS=[
  '唔該幫我睇下個冷氣','個冷氣唔凍','廁所塞咗','天花板滴水','電掣跳咗','呢條線帶電',
  '水泵唔行','燈唔著','呢個要幾耐','我而家過去','麻煩你確認一下','唔好掂'
];
(function(){
  var box=$('chips');
  CHIPS.forEach(function(p){
    var b=document.createElement('button'); b.className='chip'; b.textContent=p;
    b.onclick=function(){ setDir('zh2en'); $('src').value=p; translate(); };
    box.appendChild(b);
  });
})();

$('d2e').onclick=function(){ if(autoOn) stopAuto(); setDir('zh2en'); };
$('e2d').onclick=function(){ if(autoOn) stopAuto(); setDir('en2zh'); };
$('go').onclick=translate;
$('mic').onclick=micOnce;
$('auto').onclick=toggleAuto;
$('speak').onclick=speak;
$('vtest').onclick=voiceTest;
$('copy').onclick=copyOut;
$('clear').onclick=function(){ $('src').value=''; setDir(dir); $('src').focus(); };
$('src').addEventListener('keydown',function(e){ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) translate(); });
$('note').textContent='翻譯流程：粵語／英文先經「普通話構思」整句執齊，再輸出目標語言，避免逐詞硬拼。內置離線詞庫 '+Object.keys(T).length+' 條＋三語整句庫，涵蓋日常、職場、電工與工程術語。翻譯本身完全離線；朗讀用系統語音引擎（唔係HTML內嵌發聲檔），系統要有對應語言嘅語音包——桌面 Edge 粵語有本機語音、英文多數係線上語音（斷網可能冇聲），手機請在系統設定下載英文／粵語語音。語音識別亦由手機系統提供，多數手機要連網才可識別。聲音經手機喇叭抑或耳機播出，由手機系統決定，網頁無法強制切換。';
setDir('zh2en');
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=function(){}; }
refreshDev();
navigator.mediaDevices && navigator.mediaDevices.addEventListener && navigator.mediaDevices.addEventListener('devicechange', refreshDev);
</script>
